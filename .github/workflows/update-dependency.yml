name: Update dependency

on:
  repository_dispatch:
    types: [dependency-updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.DISPATCH_TOKEN || secrets.REPO_DISPATCH_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Save Before Version
        id: before
        run: |
          BEFORE_VERSION=$(node -p "require('./package.json').version")
          echo "version=${BEFORE_VERSION}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm install

      - name: Update dependency
        run: |
          PACKAGE_NAME="${{ github.event.client_payload.package }}"
          if [ -n "$PACKAGE_NAME" ]; then
            echo "Updating package: $PACKAGE_NAME"
            npm install ${PACKAGE_NAME}@latest
          else
            echo "No package specified, updating default dependency kschema-build-endpoints..."
            npm install kschema-build-endpoints@latest
          fi

      - name: Commit and push changes
        run: |
          # Check if there are changes
          if git diff --quiet package.json package-lock.json; then
            echo "No dependency changes detected."
            exit 0
          fi
          
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Bump version
          npm version patch --no-git-tag-version
          
          # Commit the changes
          git add package.json package-lock.json
          git commit -m "chore(deps): update ${{ github.event.client_payload.package || 'kschema-build-endpoints' }} to latest [skip ci]"
          
          # Push directly to main
          git push origin HEAD:main

      - name: Generate Workflow Summary
        if: always()
        run: |
          echo "## 📊 Dependency Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }} ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** [keshavsoft/vs-code-ext-from-any-js](https://github.com/keshavsoft/vs-code-ext-from-any-js)" >> $GITHUB_STEP_SUMMARY
          PACKAGE_NAME="${{ github.event.client_payload.package || 'kschema-build-endpoints' }}"
          echo "- **Updated Dependency:** [${PACKAGE_NAME} on npm](https://www.npmjs.com/package/${PACKAGE_NAME})" >> $GITHUB_STEP_SUMMARY
          
          # Check if the version was bumped
          AFTER_VERSION=$(node -p "require('./package.json').version")
          if [ "${{ steps.before.outputs.version }}" != "$AFTER_VERSION" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🚀 Extension Version Bump Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **Before Version:** \`${{ steps.before.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **After Version:** \`${AFTER_VERSION}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Status:** ✅ Successfully Bumped & Pushed to GitHub" >> $GITHUB_STEP_SUMMARY
          fi
